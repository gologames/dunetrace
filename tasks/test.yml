# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    desc: Run all test suites in order (no database required)
    cmds:
      - task: sdk-py
      - task: schemas
      - task: ingest
      - task: detector
      - task: explainer
      - task: alerts
      - task: api
      - task: mcp
      - task: semantic
      - task: integrations
      - task: schema-parity
      - task: sdk-ts

  sdk-py:
    desc: Run Python SDK tests
    cmd: mise exec -- uv run --locked --package dunetrace --no-dev --group test --extra langchain python -m pytest packages/sdk-py/tests/

  schemas:
    desc: Run shared schema tests
    cmd: mise exec -- uv run --locked --package dunetrace-schemas --no-dev --group test python -m pytest packages/schemas-py/tests/

  ingest:
    desc: Run ingest service tests
    cmd: mise exec -- uv run --locked --package dunetrace-ingest --no-dev --group test python -m pytest services/ingest/tests/

  detector:
    desc: Run detector service tests
    cmd: mise exec -- uv run --locked --package dunetrace-detector --no-dev --group test python -m pytest services/detector/tests/

  explainer:
    desc: Run explainer service tests
    cmd: mise exec -- uv run --locked --package dunetrace-explainer --no-dev --group test python -m pytest services/explainer/tests/

  alerts:
    desc: Run alerts service tests
    cmd: mise exec -- uv run --locked --package dunetrace-alerts --no-dev --group test python -m pytest services/alerts/tests/

  api:
    desc: Run API service tests
    cmd: mise exec -- uv run --locked --package dunetrace-api --no-dev --group test python -m pytest services/api/tests/

  mcp:
    desc: Run MCP server tests
    cmd: mise exec -- uv run --locked --package dunetrace-mcp --no-dev --group test python -m pytest packages/mcp-server/tests/

  semantic:
    desc: Run semantic service tests
    cmd: mise exec -- uv run --locked --package dunetrace-semantic --no-dev --group test python -m pytest services/semantic/tests/

  integrations:
    desc: Run integrations service tests
    cmd: mise exec -- uv run --locked --package dunetrace-integrations --no-dev --group test python -m pytest services/integrations/tests/

  schema-parity:
    desc: Run cross-service schema and run-scoping tests
    cmd: mise exec -- uv run --locked --no-dev --group test python -m pytest tests/

  sdk-ts:
    desc: Run TypeScript SDK tests
    dir: '{{.ROOT_DIR}}/packages/sdk-ts'
    cmd: mise exec -- npm test
