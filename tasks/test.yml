# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  default:
    desc: Run all test suites in order (no database required)
    cmds:
      - task: sdk-py
      - task: schemas
      - task: ingest
      - task: detector
      - task: explainer
      - task: alerts
      - task: api
      - task: mcp
      - task: semantic
      - task: integrations
      - task: schema-parity
      - task: sdk-ts

  sdk-py:
    desc: Run Python SDK tests
    dir: '{{.ROOT_DIR}}/packages/sdk-py'
    cmd: mise exec -- python -m pytest tests/ -q

  schemas:
    desc: Run shared schema tests
    env:
      PYTHONPATH: 'packages/sdk-py{{.PATH_LIST_SEPARATOR}}packages/schemas-py'
    cmd: mise exec -- python -m pytest packages/schemas-py/tests/ -v

  ingest:
    desc: Run ingest service tests
    env:
      PYTHONPATH: 'packages/sdk-py{{.PATH_LIST_SEPARATOR}}packages/schemas-py{{.PATH_LIST_SEPARATOR}}services/ingest'
    cmd: mise exec -- python -m pytest services/ingest/tests/ -v

  detector:
    desc: Run detector service tests
    env:
      PYTHONPATH: 'packages/schemas-py{{.PATH_LIST_SEPARATOR}}packages/sdk-py{{.PATH_LIST_SEPARATOR}}services/detector'
    cmd: mise exec -- python -m pytest services/detector/tests/ -v

  explainer:
    desc: Run explainer service tests
    env:
      PYTHONPATH: 'packages/schemas-py{{.PATH_LIST_SEPARATOR}}packages/sdk-py{{.PATH_LIST_SEPARATOR}}services/explainer'
    cmd: mise exec -- python -m pytest services/explainer/tests/ -v

  alerts:
    desc: Run alerts service tests
    env:
      PYTHONPATH: 'packages/schemas-py{{.PATH_LIST_SEPARATOR}}packages/sdk-py{{.PATH_LIST_SEPARATOR}}services/explainer{{.PATH_LIST_SEPARATOR}}services/alerts'
    cmd: mise exec -- python -m pytest services/alerts/tests/ -v

  api:
    desc: Run API service tests
    env:
      PYTHONPATH: 'packages/schemas-py{{.PATH_LIST_SEPARATOR}}packages/sdk-py{{.PATH_LIST_SEPARATOR}}services/explainer{{.PATH_LIST_SEPARATOR}}services/api'
    cmd: mise exec -- python -m pytest services/api/tests/ -v

  mcp:
    desc: Run MCP server tests
    cmd: mise exec -- python -m pytest packages/mcp-server/tests/ -v

  semantic:
    desc: Run semantic service tests
    env:
      PYTHONPATH: 'packages/schemas-py{{.PATH_LIST_SEPARATOR}}services/explainer{{.PATH_LIST_SEPARATOR}}services/semantic'
    cmd: mise exec -- python -m pytest services/semantic/tests/ -v

  integrations:
    desc: Run integrations service tests
    env:
      PYTHONPATH: 'packages/schemas-py{{.PATH_LIST_SEPARATOR}}services/integrations'
    cmd: mise exec -- python -m pytest services/integrations/tests/ -v

  schema-parity:
    desc: Run cross-service schema and run-scoping tests
    cmd: mise exec -- python -m pytest tests/ -v

  sdk-ts:
    desc: Run TypeScript SDK tests
    dir: '{{.ROOT_DIR}}/packages/sdk-ts'
    cmd: mise exec -- npm test
