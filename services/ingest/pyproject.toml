[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dunetrace-ingest"
version = "0.0.0"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "dunetrace-schemas[metrics]",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "asyncpg==0.29.0",
    "pydantic>=2.11.7,<3.0.0",
    "python-dotenv>=1.2.2",
    "opentelemetry-proto>=1.34.1,<2",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ingest_svc*"]
