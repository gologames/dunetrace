[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dunetrace-api"
version = "0.0.0"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "dunetrace",
    "dunetrace-schemas[metrics]",
    "dunetrace-explainer",
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "asyncpg==0.29.0",
    "pydantic>=2.11.7,<3.0.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.0",
    "cryptography>=42",
    "PyJWT[crypto]>=2.8",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["api_svc*"]
