[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dunetrace-alerts"
version = "0.0.0"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "dunetrace",
    "dunetrace-schemas[metrics]",
    "dunetrace-explainer",
    "asyncpg==0.29.0",
    "httpx==0.28.1",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0",
    "cryptography>=42",
    "pydantic>=2.11.7,<3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["alerts_svc*"]
