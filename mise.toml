min_version = "2026.10.14"

[settings]
lockfile = true
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "windows-x64",
  "windows-arm64",
  "macos-x64",
  "macos-arm64",
]

[tools]
task = "3.54.0"
python = "3.12.15"
uv = "0.13.1"
node = "22.23.3"

[env]
UV_PYTHON = "python"
UV_PYTHON_PREFERENCE = "only-system"
UV_PYTHON_DOWNLOADS = "never"
