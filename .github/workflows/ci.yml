name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  MISE_EXEC_AUTO_INSTALL: "false"

jobs:
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: python uv
      - run: uv sync --locked --no-dev --group lint
      - run: uv run --locked --no-dev --group lint ruff check .
      - run: uv run --locked --no-dev --group lint ruff format --check .
      # Dashboard safety: no inline handlers / javascript: URLs / eval in
      # dashboard/, every data-action names a key of the ACTIONS registry, and
      # nginx.conf's CSP script-src hash matches the page's inline <script>.
      # Stdlib only, nothing to install. A PR that edits the script without
      # re-running `python scripts/check_dashboard_safety.py --fix` fails here.
      - run: python scripts/check_dashboard_safety.py
      - run: python -m unittest scripts.test_check_dashboard_safety

  docs-consistency:
    name: Docs consistency (detectors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: task python uv
      # The check imports dunetrace (detectors + packs) to read real names.
      - run: uv sync --locked --no-dev --group test
      # Fails if docs claim a detector/evaluator that doesn't exist in code.
      - run: task validate:detector-docs
      - run: task validate:detector-docs-test
      # EventType / Severity / FailureType are generated into both the SDK and
      # dunetrace_schemas from enum_source.py; fails if either module is stale
      # (edit the source, run `python scripts/gen_enums.py`). Stdlib only.
      - run: uv run --locked --no-dev --group test python scripts/gen_enums.py --check
      - run: uv run --locked --no-dev --group test python -m unittest scripts.test_gen_enums
      # detectors.yml, the detector classes, and the shared parser's _PARAM_MAP
      # all have to agree: an unmapped YAML key is dropped with a startup
      # warning nobody reads, and a _PARAM_MAP entry aimed at a renamed
      # attribute produces no warning at all. Needs PyYAML to read the file and
      # dunetrace_schemas (hence pydantic) for _PARAM_MAP.
      - run: uv run --locked --no-dev --group test python scripts/check_detector_defaults.py
      - run: uv run --locked --no-dev --group test python -m unittest scripts.test_check_detector_defaults
      # Every docs/integrate-*.md must carry a <!--dunetrace:instrument--> block.
      # The dunetrace-setup skill (dunetrace/skills) generates one reference file
      # per block; a guide that loses its block silently drops out of the skill's
      # framework matching table, which is a silent no-op of exactly the kind the
      # guides themselves warn about. This only proves the guides parse -- the
      # authoritative drift check runs in the skills repo, which has both trees.
      - run: uv run --locked --no-dev --group test python scripts/gen_skill_references.py --out "$(mktemp -d)" --require-all
      - run: uv run --locked --no-dev --group test python -m unittest scripts.test_gen_skill_references
      # The detector coverage manifest the skill reads. This step is the audit:
      # it fails if a detector is not described in
      # scripts/detector_event_requirements.json, or if a detector reads a
      # RunState field that its entry neither requires nor enriches. A new
      # detector therefore cannot land without saying what instrumentation it
      # needs, which is what keeps the coverage report's counts honest.
      - run: uv run --locked --no-dev --group test python scripts/gen_detector_manifest.py --out "$(mktemp -d)"
      - run: uv run --locked --no-dev --group test python -m unittest scripts.test_gen_detector_manifest

  sdk-py:
    name: SDK (Python)
    runs-on: ubuntu-latest
    # Backstop against a hung test: the job can't burn the full 6h runner cap.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: task python uv
      - run: uv sync --locked --package dunetrace --no-dev --group test --group lint --extra langchain
      # Same Taskfile task `task test` uses, so the two cannot disagree about
      # which tests exist. PYTEST_ADDOPTS' --timeout kills (and dumps the stack
      # of) any single test that hangs, so a deadlock fails in seconds with a
      # named culprit instead of blocking the whole run for hours.
      - name: Run tests
        env:
          PYTEST_ADDOPTS: --timeout=120
        run: task test:sdk-py
      - run: task validate:sdk-py-mypy

  # `task test` runs twelve suites; this workflow's other jobs covered ten of
  # them. test-schemas (132 tests) and test-schema-parity (4) ran in NO CI job
  # at all — which is where dunetrace_schemas/metrics.py and the whole
  # migrations.py runner live, i.e. the shared code every service boots on.
  schemas:
    name: Shared schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: task python uv
      - run: uv sync --locked --package dunetrace-schemas --no-dev --group test
      - name: Run schemas tests
        env:
          PYTEST_ADDOPTS: --timeout=120
        run: task test:schemas
      # Cross-service: parses (never imports) every service's DDL and fails if
      # two of them declare the same table. No PYTHONPATH, stdlib + pytest.
      - name: Run schema-parity tests
        env:
          PYTEST_ADDOPTS: --timeout=120
        run: task test:schema-parity

  # The pre-commit config carries checks that exist nowhere else in CI — bandit,
  # detect-private-key and scripts/check_endpoint_conventions.py among them — so
  # until now they only ran for contributors who had run `pre-commit install`,
  # and `git commit --no-verify` skipped them for everyone.
  #
  # SKIP drops the hooks a dedicated job above already runs (and which would
  # need that job's whole dependency install to work here). What this job adds
  # over the rest of the workflow: bandit, gitleaks, detect-private-key,
  # check-added-large-files, check-yaml/json/case-conflict/merge-conflict and
  # the org_id-in-URL-path convention check.
  #
  # Caveat worth knowing: check-added-large-files and gitleaks both inspect the
  # git INDEX (`gitleaks protect --staged`), which in a CI checkout is identical
  # to HEAD — they run and pass here without examining anything. They stay
  # local-commit guards. Everything else in the list genuinely runs.
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: task python uv
      # Hook environments (ruff, bandit, the gitleaks Go binary) are expensive
      # to build and change only when the config's pinned revs do.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv sync --locked --no-dev --group lint
      - name: Run hooks
        env:
          SKIP: >-
            ruff,ruff-format,validate-detector-docs,validate-detector-docs-test,
            sdk-py-mypy,mcp-mypy,ts-typecheck,sdk-py-tests,schemas-py-tests,
            ingest-tests,detector-tests,explainer-tests,alerts-tests,api-tests,
            mcp-tests,sdk-ts-tests
        run: uv run --locked --no-dev --group lint pre-commit run --all-files --show-diff-on-failure

  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingest
          - service: detector
          - service: explainer
          - service: alerts
          - service: api
          - service: semantic
          - service: integrations
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: task python uv
      - run: uv sync --locked --package dunetrace-${{ matrix.service }} --no-dev --group test
      - name: Run tests
        env:
          PYTEST_ADDOPTS: --timeout=120
        run: task test:${{ matrix.service }}

  mcp-server:
    name: MCP Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: task python uv
      - run: uv sync --locked --package dunetrace-mcp --no-dev --group test --group lint
      - run: uv run --locked --package dunetrace-mcp --no-dev --group test python -m pytest packages/mcp-server/tests/ --timeout=120
      - run: task validate:mcp-mypy

  sdk-ts:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: task node
          cache_dependency_paths: packages/sdk-ts/package-lock.json
      - run: npm ci
      - run: npm test
      - run: task validate:ts-typecheck

  # audit Finding 35: build every service image on PR. Previously images were only
  # built on release tags, so broken Dockerfiles / unsatisfiable requirements
  # (F3 semantic pip conflict, F4 alerts missing dep, F17 semantic missing SDK)
  # shipped undetected until deploy. A build failure here now blocks the PR.
  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build all service images (no push)
        run: docker compose build

  # Schema ownership: a table touched by more than one service lives in
  # migrations.py and nowhere else (see that module's docstring). This is a
  # ratchet: scripts/schema_owners_baseline.json holds the current number of
  # multi-owner tables / stray ADD COLUMNs and --check fails if either goes up.
  # Lower the baseline with `python scripts/check_schema_owners.py --baseline`
  # after moving a table into migrations; the target is 0. Stdlib only.
  schema-ownership:
    name: Schema ownership
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: python
      - run: python scripts/check_schema_owners.py --check
      - run: python -m unittest scripts.test_check_schema_owners

  # Boot order is the failure mode the whole migration refactor exists to kill:
  # policies.signature was declared by exactly one service while another's query
  # selected it inside a try/except returning [], so a cold start in the wrong
  # order silently disabled every runtime guardrail in the fleet. Nothing else
  # in CI has a database at all — docker-build only runs `compose build`, which
  # never starts a container — so a migration that fails only when a particular
  # service boots first shipped undetected. scripts/verify_schema_boot_order.py
  # existed for exactly this and was wired into nothing.
  schema-boot-order:
    name: Schema boot order (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dunetrace
          POSTGRES_PASSWORD: dunetrace
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dunetrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-tools
        with:
          tools: task python uv
      # The script boots every service's schema-init in turn, so it needs what
      # each of them imports at that point: asyncpg, the shared schemas package
      # and the SDK (explainer_svc and the detector both import dunetrace).
      - run: uv sync --locked --no-dev --group test
      - name: Verify boot order, concurrency, idempotence and upgrade
        env:
          DATABASE_URL: postgresql://dunetrace:dunetrace@127.0.0.1:5432/postgres
        run: task db:test-schema
