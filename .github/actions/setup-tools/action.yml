name: Setup tools
description: Install locked tools with mise and cache package downloads

inputs:
  tools:
    description: Tools to install
  cache_dependency_paths:
    description: Dependency files used for the package cache key

runs:
  using: composite
  steps:
    - name: Install tools
      id: mise
      uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5
      with:
        minimum_release_age: "0s"
        install_args: ${{ inputs.tools }}

    - name: Cache Python package downloads
      if: >-
        inputs.cache_dependency_paths != '' &&
        steps.mise.outputs.python != ''
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles(inputs.cache_dependency_paths) }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache JavaScript package downloads
      if: >-
        inputs.cache_dependency_paths != '' &&
        steps.mise.outputs.node != ''
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-${{ hashFiles(inputs.cache_dependency_paths) }}
        restore-keys: |
          ${{ runner.os }}-npm-
